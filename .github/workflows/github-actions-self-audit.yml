name: GitHub Actions Self Audit

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  github-actions-self-audit:
    name: GitHub Actions Self Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run GitHub Actions failure checklist
        run: |
          python skills/github-actions-failure-checklist/scripts/audit_github_actions.py .
