name: Refresh Fintech Signals

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-fintech-signals:
    name: Refresh Fintech Signals
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Refresh persisted fintech contract
        run: |
          python3 services/ingestion/src/main.py

      - name: Commit refreshed contract if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fintech/signals.latest.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh fintech signal contract"
          git push
